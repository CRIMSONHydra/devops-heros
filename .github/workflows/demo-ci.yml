name: Demo CI Pipeline

# Runnable copy of session16-github-actions/.../11-demo-project/.github/workflows/ci.yml
# (GitHub only reads workflows from the repo root, so paths point at the project folder).
on:
  push:
    branches: [main]
    paths: ["session16-github-actions/session-16-github-actions/HW/**", ".github/workflows/demo-*.yml"]
  pull_request:
    branches: [main]
    paths: ["session16-github-actions/session-16-github-actions/HW/**"]
  workflow_dispatch:

env:
  PROJECT_DIR: session16-github-actions/session-16-github-actions/HW

defaults:
  run:
    working-directory: ${{ env.PROJECT_DIR }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.PROJECT_DIR }}/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -v --junitxml=test-results/junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ${{ env.PROJECT_DIR }}/test-results/

  security-check:
    name: Security Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for sensitive files
        run: |
          if find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \) | grep -q .; then
            echo "Potential sensitive file found."
            exit 1
          fi
          echo "No common sensitive files found."

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build application
        run: bash build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: ${{ env.PROJECT_DIR }}/build/

  docker-build:
    name: Docker Build and Smoke Test
    needs: [test, security-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image (not pushed)
        run: docker build -t calculator-api:ci --build-arg APP_VERSION=${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 5000:5000 calculator-api:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:5000/health && break
            sleep 1
          done
          curl -fs "http://localhost:5000/calc/add?a=2&b=3"
          docker rm -f api
