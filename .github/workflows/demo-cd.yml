name: Demo CD Pipeline

# Runnable copy of session16-github-actions/.../11-demo-project/.github/workflows/cd.yml
on:
  workflow_run:
    workflows: ["Demo CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

env:
  REGISTRY: ghcr.io
  PROJECT_DIR: session16-github-actions/session-16-github-actions/HW

jobs:
  publish-image:
    name: Publish Docker Image
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: vars
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "tag=${SHA::7}" >> "$GITHUB_OUTPUT"
          # image names must be lowercase (owner may contain capitals)
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}/calculator-api" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: true
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest

  deploy:
    name: Deploy to Staging
    needs: publish-image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download build artifact from the CI run
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: calculator-build
          path: build/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Show build info
        if: ${{ github.event_name == 'workflow_run' }}
        run: cat build/build-info.txt
      - name: Deploy (simulated)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          IMAGE: ${{ needs.publish-image.outputs.image }}:${{ needs.publish-image.outputs.tag }}
        run: |
          echo "Deploying $IMAGE to staging"
          if [ -z "$DEPLOY_TOKEN" ]; then echo "DEPLOY_TOKEN not set, skipping real deploy"; else echo "Using deploy token (masked in logs)"; fi
          echo "Deployment complete"
